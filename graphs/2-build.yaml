# This graph starts after the opportunity node in 1-discover.yaml says GO.
- {id: flow, owner: builder, skill: manual, needs: [], out: research/poc.md, gate: "one flow, <=5 steps, written", timebox_min: 15}
- {id: scaffold, owner: agent, skill: /scaffold, needs: [flow], out: app/, gate: "app runs locally; llm() hits api.mor.org; no-other-vendors.sh PASS; deployed preview URL", timebox_min: 20}
- {id: poc, owner: agent, skill: /poc, needs: [scaffold], out: research/poc-runs/, gate: "useful output on 2 of 3 real inputs", timebox_min: 180}
- {id: mvp, owner: agent, skill: /poc, needs: [poc], out: app/, gate: "stranger can use it unaided; fallback model works; run log written", timebox_min: 150}
- {id: freeze, owner: builder, skill: manual, needs: [mvp], out: "git tag demo", gate: "feature freeze at the time set in CLAUDE.md; backup recording saved", timebox_min: 10, human_gate: true}
- {id: release, owner: builder, skill: manual, needs: [freeze], out: research/release.md, gate: "approver says yes to the exact build and domain BEFORE deploy; production URL + deploy ID + rollback steps recorded", timebox_min: 20, human_gate: true}
