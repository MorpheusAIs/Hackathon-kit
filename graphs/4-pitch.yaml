# Run after graphs/5-showcase.yaml (synopsis + deck exist). script reads research/pain-map.md, gtm.md, name.md, poc-runs/ and the live site numbers (from graphs 1-3).
- {id: script, owner: agent, skill: /pitch, needs: [], out: research/pitch.md, gate: "timed script + 10 hard Q&A", timebox_min: 45}
- {id: drill, owner: researcher, skill: manual, needs: [script], out: research/pitch-drill.md, gate: "each team member answers all 10 cold", timebox_min: 30}
- {id: rehearse, owner: builder, skill: manual, needs: [drill], out: research/pitch-rehearsal.md, gate: "3 timed run-throughs under the limit, demo live once + backup once", timebox_min: 45}
- {id: approve-final, owner: approver, skill: manual, needs: [rehearse], out: research/approvals.md, gate: "approver approves the final deck + script after rehearsal edits", timebox_min: 10, human_gate: true}
